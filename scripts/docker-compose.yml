name: ducklake-minio-tests

services:
  minio:
    image: astrovela-minio-test:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      TZ: UTC
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
    command: ["server", "/data"]

  mc:
    image: astrovela-mc-test:RELEASE.2025-08-13T08-35-41Z
    pull_policy: never
    profiles: ["setup"]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/bin/mc alias set local http://minio:9000 admin password
        /usr/bin/mc mb --ignore-existing local/mybucket

volumes:
  minio-data:
