[package]
name = "ducklake-vortex-index-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
publish = false
license = "MIT"

[dependencies]
ducklake-vortex-query = { path = "../../../src/vortex_query" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vortex = { git = "https://github.com/AstroVela/vortex.git", rev = "122b63e0408a187a9d0ecdd129f1cbe12b6b46b2" }
vortex-index = { git = "https://github.com/AstroVela/vortex.git", rev = "122b63e0408a187a9d0ecdd129f1cbe12b6b46b2", features = ["file", "local-store"] }
