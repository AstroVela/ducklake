[package]
name = "ducklake-vortex-index-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
publish = false
license = "MIT"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vortex = { git = "https://github.com/AstroVela/vortex.git", rev = "ee085f55a705cb9b2edab18d392dd822540774d7" }
vortex-index = { git = "https://github.com/AstroVela/vortex.git", rev = "ee085f55a705cb9b2edab18d392dd822540774d7", features = ["file", "local-store"] }
vortex-index-spfresh = { git = "https://github.com/AstroVela/vortex.git", rev = "ee085f55a705cb9b2edab18d392dd822540774d7", features = ["native"] }

[profile.ci]
inherits = "dev"
debug = false
opt-level = 1
