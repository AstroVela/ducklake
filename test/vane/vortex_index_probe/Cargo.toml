[package]
name = "ducklake-vortex-index-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
publish = false
license = "MIT"

[dependencies]
ducklake-vortex-query = { path = "../../../src/vortex_query" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vortex = { git = "https://github.com/AstroVela/vortex.git", rev = "c44eba3096f01a5b7d556a549cd3b2462b6f43ba" }
vortex-index = { git = "https://github.com/AstroVela/vortex.git", rev = "c44eba3096f01a5b7d556a549cd3b2462b6f43ba", features = ["file", "local-store"] }
