[package]
name = "ducklake-vortex-query"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vortex = { git = "https://github.com/AstroVela/vortex.git", rev = "65dab44f86495d35bb46f69c8ec5cfc7a3544c1b" }
vortex-index = { git = "https://github.com/AstroVela/vortex.git", rev = "65dab44f86495d35bb46f69c8ec5cfc7a3544c1b", features = ["file", "local-store"] }
vortex-index-spfresh = { git = "https://github.com/AstroVela/vortex.git", rev = "65dab44f86495d35bb46f69c8ec5cfc7a3544c1b", features = ["native"] }
