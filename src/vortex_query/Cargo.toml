[package]
name = "ducklake-vortex-query"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vortex = { git = "https://github.com/AstroVela/vortex.git", rev = "703ed464a5e03bee45c8713c5a4286571349bce1" }
vortex-index = { git = "https://github.com/AstroVela/vortex.git", rev = "703ed464a5e03bee45c8713c5a4286571349bce1", features = ["file", "local-store"] }
vortex-index-spfresh = { git = "https://github.com/AstroVela/vortex.git", rev = "703ed464a5e03bee45c8713c5a4286571349bce1", features = ["native"] }
