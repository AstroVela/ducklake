[package]
name = "ducklake-vortex-query"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
vortex = { git = "https://github.com/AstroVela/vortex.git", rev = "122b63e0408a187a9d0ecdd129f1cbe12b6b46b2" }
vortex-index = { git = "https://github.com/AstroVela/vortex.git", rev = "122b63e0408a187a9d0ecdd129f1cbe12b6b46b2", features = ["file", "local-store"] }
vortex-index-spfresh = { git = "https://github.com/AstroVela/vortex.git", rev = "122b63e0408a187a9d0ecdd129f1cbe12b6b46b2", features = ["native"] }
