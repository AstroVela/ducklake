name: Native Vortex validation

on:
  pull_request:
  push:
    branches: [v1.5-variegata_vane]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ducklake-vortex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native Vortex ${{ matrix.vortex }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        vortex: ['OFF', 'ON']
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_BUILD_JOBS: '2'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
      VCPKG_MAX_CONCURRENCY: '2'
      DISABLE_EXTENSIONS_FOR_TEST: '1'
      VORTEX_REVISION: 664e8cb733c5fbaa2945239e806df5b22e6d190d
      VORTEX_SPFRESH_NATIVE: ${{ github.workspace }}/build/spfresh/build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize pinned DuckDB
        run: git submodule update --init duckdb
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libclang-dev autoconf automake libtool pkg-config libzstd-dev
          mkdir -p .cache/vcpkg build/validation-logs
      - name: Restore native caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/ccache
            .cache/vcpkg
          key: ducklake-vortex-v1-${{ runner.os }}-${{ matrix.vortex }}-${{ hashFiles('vcpkg.json', 'extension_config.cmake', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ducklake-vortex-v1-${{ runner.os }}-${{ matrix.vortex }}-${{ hashFiles('vcpkg.json', 'extension_config.cmake', '.gitmodules') }}-
      - name: Set up pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          doNotCache: true
      - name: Set up Rust
        if: matrix.vortex == 'ON'
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Restore Rust cache
        if: matrix.vortex == 'ON'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/vortex-validation/cargo/build
          key: ducklake-vortex-rust-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'extension_config.cmake', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ducklake-vortex-rust-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'extension_config.cmake', '.gitmodules') }}-
      - name: Qualify the pinned native SPFresh backend for SQL search
        if: matrix.vortex == 'ON'
        run: |
          git init build/vortex-source
          git -C build/vortex-source fetch --depth 1 https://github.com/AstroVela/vortex.git "$VORTEX_REVISION"
          git -C build/vortex-source checkout --detach FETCH_HEAD
          test "$(git -C build/vortex-source rev-parse HEAD)" = "$VORTEX_REVISION"
          bash build/vortex-source/vortex-index-spfresh/native/build.sh "$PWD/build/spfresh" \
            2>&1 | tee build/validation-logs/spfresh-build.log
      - name: Configure
        run: |
          flags=()
          if [[ '${{ matrix.vortex }}' == ON ]]; then
            flags=(-DDUCKLAKE_ENABLE_VORTEX=ON -DRust_TOOLCHAIN=1.91.0)
          fi
          cmake -S duckdb -B build/vortex-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOVERRIDE_GIT_DESCRIBE="$(cat .github/duckdb-version)" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_BUILD=ON -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_DIR="$PWD" \
            -DBUILD_EXTENSIONS=parquet \
            -DDUCKDB_EXTENSION_CONFIGS="$PWD/extension_config.cmake" \
            '-DSKIP_EXTENSIONS=icu;json;tpch;jemalloc' \
            -DEXTENSION_STATIC_BUILD=ON -DBUILD_SHELL=ON -DBUILD_UNITTESTS=ON \
            -DENABLE_UNITTEST_CPP_TESTS=OFF \
            -DENABLE_EXTENSION_AUTOLOADING=OFF -DENABLE_EXTENSION_AUTOINSTALL=OFF \
            -DEXTENSION_DIRECTORIES="$PWD/build/vortex-validation/empty-extensions" \
            -DUNITTEST_ROOT_DIRECTORY="$PWD" \
            "${flags[@]}" 2>&1 | tee build/validation-logs/configure.log
      - name: Build
        run: cmake --build build/vortex-validation --target duckdb unittest 2>&1 | tee build/validation-logs/build.log
      - name: Build the native read-view and catalog drivers
        if: matrix.vortex == 'ON'
        run: cmake --build build/vortex-validation --target ducklake_vortex_view_driver ducklake_vortex_catalog_driver ducklake_vortex_cost_driver 2>&1 | tee build/validation-logs/read-view-driver-build.log
      - name: Validate native files and recovery
        run: |
          python3 -I scripts/run_native_vortex_validation.py \
            --duckdb build/vortex-validation/duckdb \
            --unittest build/vortex-validation/test/unittest \
            --mode '${{ matrix.vortex }}' --output-dir build/validation-logs/tests
      - name: Retain the qualified shell for the index proof
        if: matrix.vortex == 'ON'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-vortex-index-shell
          path: |
            build/vortex-validation/duckdb
            build/vortex-validation/ducklake_vortex_view_driver
            build/vortex-validation/ducklake_vortex_catalog_driver
            build/vortex-validation/ducklake_vortex_cost_driver
          retention-days: 7
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-vortex-${{ matrix.vortex }}
          path: |
            build/validation-logs/
            build/vortex-validation/CMakeCache.txt
          retention-days: 7

  index:
    name: Native DuckLake to Vortex SPFresh
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/index-cargo
      VORTEX_SPFRESH_NATIVE: ${{ github.workspace }}/build/spfresh/build
      VORTEX_REVISION: 664e8cb733c5fbaa2945239e806df5b22e6d190d
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-vortex-index-shell
          path: build/index-shell
      - name: Install the native backend build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libzstd-dev
          rustup toolchain install 1.91.0 --profile minimal --component clippy --component rustfmt
          chmod +x build/index-shell/duckdb build/index-shell/ducklake_vortex_view_driver build/index-shell/ducklake_vortex_catalog_driver build/index-shell/ducklake_vortex_cost_driver
          mkdir -p build/index-logs
      - name: Restore Rust build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/index-cargo
          key: ducklake-index-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ducklake-index-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check out the existing Vortex index implementation
        run: |
          git init build/vortex-source
          git -C build/vortex-source fetch --depth 1 https://github.com/AstroVela/vortex.git "$VORTEX_REVISION"
          git -C build/vortex-source checkout --detach FETCH_HEAD
          test "$(git -C build/vortex-source rev-parse HEAD)" = "$VORTEX_REVISION"
      - name: Build and qualify the pinned SPFresh native libraries
        run: |
          bash build/vortex-source/vortex-index-spfresh/native/build.sh "$PWD/build/spfresh" \
            2>&1 | tee build/index-logs/native-build.log
      - name: Build and lint the shared query library and validation probe
        run: |
          cargo +1.91.0 fmt --all -- --check
          cargo +1.91.0 clippy --workspace --profile ci --locked \
            --all-targets --all-features -- -D warnings 2>&1 | tee build/index-logs/clippy.log
          cargo +1.91.0 build --package ducklake-vortex-index-probe --profile ci --locked \
            2>&1 | tee build/index-logs/bridge-build.log
      - name: Validate the DuckLake and Vortex index boundary
        run: |
          python3 -I test/vane/test_native_vortex_index.py \
            --duckdb build/index-shell/duckdb \
            --probe build/index-cargo/ci/ducklake-vortex-index-probe \
            --output-dir build/index-logs/proof
      - name: Validate retained read views and resource release
        run: |
          python3 -I test/vane/test_native_vortex_read_view.py \
            --duckdb build/index-shell/duckdb \
            --probe build/index-cargo/ci/ducklake-vortex-index-probe \
            --output-dir build/index-logs/read-view
      - name: Validate mixed ANN, scan and inlined top-k
        run: |
          python3 -I test/vane/test_native_vortex_mixed.py \
            --duckdb build/index-shell/duckdb \
            --probe build/index-cargo/ci/ducklake-vortex-index-probe \
            --output-dir build/index-logs/mixed
      - name: Validate native read-view admission during concurrent maintenance
        run: |
          python3 -I test/vane/test_native_vortex_admission.py \
            --duckdb build/index-shell/duckdb \
            --driver build/index-shell/ducklake_vortex_view_driver \
            --probe build/index-cargo/ci/ducklake-vortex-index-probe \
            --output-dir build/index-logs/admission
      - name: Validate native catalog index publication and recovery
        run: |
          python3 -I test/vane/test_native_vortex_catalog.py \
            --duckdb build/index-shell/duckdb \
            --driver build/index-shell/ducklake_vortex_catalog_driver \
            --probe build/index-cargo/ci/ducklake-vortex-index-probe \
            --output-dir build/index-logs/catalog
      - name: Validate native SQL vector search and resource release
        run: |
          python3 -I test/vane/test_native_vortex_search.py \
            --duckdb build/index-shell/duckdb \
            --driver build/index-shell/ducklake_vortex_catalog_driver \
            --probe build/index-cargo/ci/ducklake-vortex-index-probe \
            --output-dir build/index-logs/sql-search
      - name: Validate query projections and record isolated process cost
        run: |
          python3 -I test/vane/test_native_vortex_cost.py \
            --duckdb build/index-shell/duckdb \
            --driver build/index-shell/ducklake_vortex_catalog_driver \
            --cost-driver build/index-shell/ducklake_vortex_cost_driver \
            --probe build/index-cargo/ci/ducklake-vortex-index-probe \
            --output-dir build/index-logs/query-cost
      - name: Upload index validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ducklake-vortex-index
          path: build/index-logs/
          retention-days: 7
